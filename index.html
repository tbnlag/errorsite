<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluestar Games - Maintenance</title>
  <meta name="description" content="Bluestar Games is currently updating the site." />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #ffffff;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 620px;
      width: 100%;
      background: #151d34;
      border: 1px solid #2b3b66;
      border-radius: 12px;
      padding: 28px 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #d4defa;
      font-size: 18px;
      line-height: 1.5;
    }

    .domain {
      color: #8ec5ff;
      font-weight: bold;
    }

    @media (max-width: 640px) {
      h1 { font-size: 26px; }
      p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>We are updating the site</h1>
    <p>
      <span class="domain">bluestargames.online</span> is temporarily under maintenance.<br />
      Please check back soon.
    </p>
  </main>
</body>
</html>
