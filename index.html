<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bluestar Games | Site Update in Progress</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-start: #0a122b;
        --bg-end: #101b44;
        --card: rgba(18, 30, 74, 0.72);
        --text: #f2f6ff;
        --muted: #b4c1e6;
        --accent: #6fb4ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, var(--bg-end), var(--bg-start));
        color: var(--text);
      }

      main {
        width: min(640px, 100%);
        background: var(--card);
        border: 1px solid rgba(111, 180, 255, 0.25);
        border-radius: 18px;
        padding: clamp(1.5rem, 3vw, 2.5rem);
        text-align: center;
        backdrop-filter: blur(6px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 2.2vw, 1.15rem);
        color: var(--muted);
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        border: 1px solid rgba(111, 180, 255, 0.45);
        color: var(--accent);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Bluestar Games</span>
      <h1>We are updating the site</h1>
      <p>
        Thanks for your patience — <strong>bluestargames.online</strong> is currently under maintenance.
        We’ll be back online soon.
      </p>
    </main>
  </body>
</html>
